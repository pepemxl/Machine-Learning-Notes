# docs/diagrams/README.md documenta los scripts de diagramas: es tooling
# interno, no contenido del curso, asi que no entra en el nav.
not_in_nav: |
  /diagrams/README.md

theme:
  name: material
  language: es
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    scheme: slate
    primary: indigo
    accent: indigo

plugins:
  - search:
      lang: es
  - mermaid2
  - glightbox
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      include_source: true
      ignore_h1_titles: true
  - redirects:
      redirect_maps:
        '00_DATA/README.md': '00_DATA/fases_analisis_datos.md'
