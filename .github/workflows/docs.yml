name: docs

on:
  push:
    branches: [master]
    paths: ['docs/**', 'mkdocs.yml', 'src/containers/docs/requirements.txt', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'src/containers/docs/requirements.txt', '.github/workflows/docs.yml']
  workflow_dispatch:

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/containers/docs/requirements.txt

      - name: Install dependencies
        run: pip install -r src/containers/docs/requirements.txt

      # Falla si hay enlaces rotos, entradas del nav inexistentes
      # o paginas fuera del nav no declaradas en not_in_nav.
      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
